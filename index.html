<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projectile Motion & Osculating Circle</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #a0d8ef, #f0f9ff);
      text-align: center;
      margin: 0;
      padding: 0;
      color: #222;
    }

    h2 {
      margin: 10px 0 5px;
      color: #004466;
    }

    .controls {
      background: #e0f7fa;
      padding: 10px;
      border-bottom: 2px solid #00838f;
    }

    label {
      margin: 0 10px;
      font-weight: bold;
      color: #006064;
    }

    input[type=range] {
      width: 120px;
    }

    #runBtn {
      background-color: #00838f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #runBtn:hover {
      background-color: #006064;
    }

    canvas {
      width: 100%;
      height: 600px;  /* fixed height for visibility */
      display: block;
      background: linear-gradient(to top, #5cc0ff, #aeeaff);
    }

    #radiusInfo {
      font-weight: bold;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h2>Projectile Motion with Osculating Circle</h2>
  <div class="controls">
    <label>Velocity (m/s): <input id="velocity" type="range" min="5" max="50" value="25" /></label>
    <label>Angle (°): <input id="angle" type="range" min="10" max="80" value="45" /></label>
    <button id="runBtn">Run</button>
    <div id="radiusInfo">Radius of curvature: </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const velocitySlider = document.getElementById("velocity");
    const angleSlider = document.getElementById("angle");
    const radiusInfo = document.getElementById("radiusInfo");
    const runBtn = document.getElementById("runBtn");

    let v0 = parseFloat(velocitySlider.value);
    let theta = parseFloat(angleSlider.value) * Math.PI / 180;
    const g = 9.8;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    function draw() {
      resizeCanvas();
      v0 = parseFloat(velocitySlider.value);
      theta = parseFloat(angleSlider.value) * Math.PI / 180;

      const t_flight = 2 * v0 * Math.sin(theta) / g;
      const x_max = v0 * Math.cos(theta) * t_flight;
      const y_max = (v0 * Math.sin(theta)) ** 2 / (2 * g);

      const scale = (canvas.width * 0.8) / x_max;
      const offsetX = canvas.width * 0.1;
      const groundY = canvas.height * 0.85;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = "#00695c";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Trajectory
      ctx.beginPath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#004d80";
      for (let t = 0; t <= t_flight; t += t_flight / 200) {
        const x = v0 * Math.cos(theta) * t;
        const y = v0 * Math.sin(theta) * t - 0.5 * g * t * t;
        const px = offsetX + x * scale;
        const py = groundY - y * scale;
        if (t === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Apex
      const t_apex = v0 * Math.sin(theta) / g;
      const x_apex = v0 * Math.cos(theta) * t_apex;
      const y_apex = y_max;

      const px_apex = offsetX + x_apex * scale;
      const py_apex = groundY - y_apex * scale;

      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(px_apex, py_apex, 6, 0, 2 * Math.PI);
      ctx.fill();

      // Radius of curvature at apex
      const R = (v0 ** 2) * Math.cos(theta) ** 2 / g;

      // Osculating circle
      ctx.beginPath();
      ctx.strokeStyle = "rgba(0, 150, 255, 0.7)";
      ctx.lineWidth = 2;
      const circleCenterY = py_apex + R * scale;
      ctx.arc(px_apex, circleCenterY, R * scale, 0, 2 * Math.PI);
      ctx.stroke();

      // Draw radius line
      ctx.beginPath();
      ctx.strokeStyle = "#0097a7";
      ctx.moveTo(px_apex, py_apex);
      ctx.lineTo(px_apex, circleCenterY);
      ctx.stroke();

      radiusInfo.textContent = `Radius of curvature: ${R.toFixed(2)} m`;
    }

    runBtn.addEventListener("click", draw);
    draw();
  </script>
</body>
</html>
